name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: betting
          POSTGRES_PASSWORD: betting_local_password
          POSTGRES_DB: betting_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U betting -d betting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Force all test database consumers to this loopback-only CI database.
      TEST_DATABASE_URL: postgresql://betting:betting_local_password@127.0.0.1:5432/betting_test
      DATABASE_URL: postgresql://betting:betting_local_password@127.0.0.1:5432/betting_test
      PLAN11_SCHEMA_DATABASE_URL: postgresql://betting:betting_local_password@127.0.0.1:5432/betting_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test requirements
        run: |
          python -m pip install --upgrade pip
          # Avoid pulling the production CUDA wheel in CPU-only GitHub runners.
          awk '!/^--extra-index-url/ && !/^torch==/' requirements-betting.txt > /tmp/requirements-ci.txt
          python -m pip install -e '.[dev]'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install -r /tmp/requirements-ci.txt
      - name: Check migrations on an empty database
        run: alembic upgrade head
      - name: Lint correctness checks
        run: ruff check src betting_app scripts
      - name: Run full application test suite
        run: python -m pytest -q betting_app/tests

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  portfolio-demo:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      PLAN11_SCHEMA_DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install demo-only package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[demo]' 'pytest>=8,<10'
      - name: Verify installed package descendants
        run: |
          cd "$RUNNER_TEMP"
          python -c "from src.analysis.unified_evaluation_engine import UnifiedBettingEngine, simulate_operational_portfolio"
          python -c "from betting_app.services.bet_qualification_service import is_bet_eligible"
      - name: Run documented demo outside the research checkout
        run: |
          mkdir -p "$RUNNER_TEMP/demo-clone/scripts"
          cp scripts/run_unified_betting_evaluation.py "$RUNNER_TEMP/demo-clone/scripts/"
          cd "$RUNNER_TEMP/demo-clone"
          python scripts/run_unified_betting_evaluation.py --demo > "$RUNNER_TEMP/demo.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path(os.environ["RUNNER_TEMP"], "demo.json").read_text())
          assert payload["status"] == "SYNTHETIC_SCENARIO_NOT_MODEL_EVIDENCE"
          PY
      - name: Run synthetic portfolio regression
        run: python -m pytest -q tests/test_portfolio_scenario_demo.py
