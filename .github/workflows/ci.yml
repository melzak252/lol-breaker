name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: betting
          POSTGRES_PASSWORD: betting_local_password
          POSTGRES_DB: betting_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U betting -d betting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Force all test database consumers to this loopback-only CI database.
      TEST_DATABASE_URL: postgresql://betting:betting_local_password@127.0.0.1:5432/betting_test
      DATABASE_URL: postgresql://betting:betting_local_password@127.0.0.1:5432/betting_test
      PLAN11_SCHEMA_DATABASE_URL: postgresql://betting:betting_local_password@127.0.0.1:5432/betting_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test requirements
        run: |
          python -m pip install --upgrade pip
          # Avoid pulling the production CUDA wheel in CPU-only GitHub runners.
          awk '!/^--extra-index-url/ && !/^torch==/' requirements-betting.txt > /tmp/requirements-ci.txt
          python -m pip install -e '.[dev]'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install -r /tmp/requirements-ci.txt
      - name: Check migrations on an empty database
        run: alembic upgrade head
      - name: Lint correctness checks
        run: ruff check src betting_app scripts
      - name: Run full application test suite
        run: python -m pytest -q betting_app/tests

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
