[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-breaker"
version = "0.1.0"
description = "League of Legends match outcome prediction and tournament simulation system"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jakub Melzacki", email = "melzacki.jakubl@gmail.com" }]
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "betting_app*"]
namespaces = false

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "scipy>=1.14,<2", "joblib>=1.4,<2", "pyarrow>=18,<25", "lightgbm>=4,<5", "PyYAML>=6,<7"]
demo = ["numpy>=2,<3", "pandas>=3,<4", "scikit-learn>=1.5,<2"]
replay = ["numpy==2.4.4", "pandas==3.0.3", "scipy==1.17.1", "scikit-learn==1.8.0", "pyarrow==24.0.0", "PyYAML>=6,<7", "dvc==3.67.1"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F821", "F822", "F823", "F601", "F602"]
