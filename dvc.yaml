      - data/07_model_output/oddsportal/c0_thesis_books_joint_20261009_115922Z/joint_scoring_cohorts.parquet
      - data/odds.csv
      - data/model_predictions_2020_2026.parquet
      - data/04_feature/production_2h_odds_trajectory.parquet
      - data/08_reporting/optimal_strategy_simulation_ledger.csv
      - data/06_models/model_preservation/prop_distribution_20261007_01.zip
      - data/08_reporting/prop_distribution/prop_distribution_20261007_01/metrics.json
      - src/models/cross_region_input_normalizer.py
      - data/08_reporting/c0_upgrade_and_distillation_20261017/multiscale_20token_predictions.parquet
      - data/08_reporting/c0_upgrade_and_distillation_20261017/multiscale_20token_distilled.json
      - data/08_reporting/c0_upgrade_and_distillation_20261017/models/multiscale_20token_distilled/seed_20260910/checkpoint_epoch16.pt
      - data/08_reporting/c0_upgrade_and_distillation_20261017/models/multiscale_20token_distilled/seed_20260911/checkpoint_epoch16.pt
      - data/08_reporting/c0_upgrade_and_distillation_20261017/models/multiscale_20token_distilled/seed_20260912/checkpoint_epoch16.pt
